sonar.projectKey=rowan-vr_memuki
sonar.organization=rowan-vr
sonar.projectName=Memuki

# Only hand-written code is analyzed. The Flutter platform runners (C/C++) are
# generated boilerplate and would need a C/C++ build wrapper to analyze in CI.
sonar.sources=apps/client/lib,.github
sonar.tests=apps/client/test
sonar.exclusions=**/l10n/generated/**,**/*.g.dart,**/*.freezed.dart
sonar.test.exclusions=**/generated_migrations/**
# Drift table definitions are read by the code generator and never executed.
sonar.coverage.exclusions=apps/client/lib/storage/tables/**

sonar.dart.lcov.reportPaths=apps/client/coverage/lcov.info
