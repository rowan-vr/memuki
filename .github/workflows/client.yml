name: Client

# Runs on every push and pull request so the "Client CI" gate job always
# reports a status and can be a required check. The expensive jobs only run
# when client files change; otherwise they are skipped and the gate passes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    working-directory: apps/client

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # paths-filter lists the PR's changed files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      client: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.client == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            client:
              - apps/client/**
              - .fvmrc
              - .github/workflows/client.yml

  check:
    name: Format, analyze, test
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned Flutter version
        id: fvm
        working-directory: .
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Check generated code is up to date
        run: |
          dart run build_runner build
          if [ -n "$(git status --porcelain -- .)" ]; then
            git status --porcelain -- .
            echo "::error::Generated code is out of date. Run 'fvm dart run build_runner build' and commit the result."
            exit 1
          fi

      - run: flutter analyze

      - run: flutter test

  build-linux:
    name: Linux build
    needs: [changes, check]
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned Flutter version
        id: fvm
        working-directory: .
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - run: flutter pub get --enforce-lockfile

      - run: flutter build linux --release

  # Single required check for branch protection. Passes when the client jobs
  # succeeded or were skipped because no client files changed.
  gate:
    name: Client CI
    needs: [changes, check, build-linux]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check job results
        working-directory: .
        run: |
          echo "changes: ${{ needs.changes.result }}"
          echo "check: ${{ needs.check.result }}"
          echo "build-linux: ${{ needs.build-linux.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
