name: Project sync

# Adds issues to the Memuki Roadmap project and keeps its Phase field in sync
# with the issue's `phase: <n>` label.
#
# Requires the PROJECT_TOKEN secret: a classic personal access token with the
# `project` scope. GITHUB_TOKEN cannot access user-owned projects.

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]

permissions: {}

concurrency:
  group: project-sync-${{ github.event.issue.number }}

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      OWNER: rowan-vr
      PROJECT_NUMBER: 4
      ISSUE_ID: ${{ github.event.issue.node_id }}
      LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
    steps:
      - name: Add issue to project and sync Phase
        run: |
          set -euo pipefail

          project=$(gh api graphql \
            -f query='query($owner: String!, $number: Int!) {
              user(login: $owner) {
                projectV2(number: $number) {
                  id
                  field(name: "Phase") { ... on ProjectV2SingleSelectField { id options { id name } } }
                }
              }
            }' \
            -f owner="$OWNER" -F number="$PROJECT_NUMBER")
          project_id=$(jq -r '.data.user.projectV2.id' <<<"$project")
          field_id=$(jq -r '.data.user.projectV2.field.id' <<<"$project")

          # Returns the existing item if the issue is already in the project.
          item_id=$(gh api graphql \
            -f query='mutation($project: ID!, $issue: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) { item { id } }
            }' \
            -f project="$project_id" -f issue="$ISSUE_ID" \
            --jq '.data.addProjectV2ItemById.item.id')

          phase=$(jq -r '[.[] | select(startswith("phase: ")) | ltrimstr("phase: ")] | first // empty' <<<"$LABELS")

          if [ -z "$phase" ]; then
            gh api graphql \
              -f query='mutation($project: ID!, $item: ID!, $field: ID!) {
                clearProjectV2ItemFieldValue(input: {projectId: $project, itemId: $item, fieldId: $field}) { clientMutationId }
              }' \
              -f project="$project_id" -f item="$item_id" -f field="$field_id" >/dev/null
            echo "No phase label; cleared Phase"
            exit 0
          fi

          # Option names look like "5a · Dictionary Infrastructure and Japanese Search".
          option_id=$(jq -r --arg p "$phase" \
            '.data.user.projectV2.field.options[] | select(.name | startswith($p + " · ")) | .id' <<<"$project")
          if [ -z "$option_id" ]; then
            echo "::warning::No Phase option matches label 'phase: $phase'"
            exit 0
          fi

          gh api graphql \
            -f query='mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project, itemId: $item, fieldId: $field,
                value: {singleSelectOptionId: $option}
              }) { clientMutationId }
            }' \
            -f project="$project_id" -f item="$item_id" -f field="$field_id" -f option="$option_id" >/dev/null
          echo "Set Phase to $phase"
