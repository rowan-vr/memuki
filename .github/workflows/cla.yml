name: CLA

# Asks pull request authors to agree to CLA.md. Signatures are stored in
# signatures/cla.json on the unprotected `cla-signatures` branch.
#
# pull_request_target is required to comment on pull requests from forks. The
# job never checks out pull request code.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA check
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/rowan-vr/memuki/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: rowan-vr,dependabot[bot],github-actions[bot]
          create-file-commit-message: "chore: create CLA signatures file"
          signed-commit-message: "chore: $contributorName signed the CLA in #$pullRequestNo"
