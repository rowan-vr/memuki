name: Feature request
description: Propose new functionality.
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: Check the [roadmap](https://github.com/rowan-vr/memuki/blob/main/docs/ROADMAP.md) and [non-goals](https://github.com/rowan-vr/memuki/blob/main/docs/VISION.md#non-goals) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
