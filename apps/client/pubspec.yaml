name: memuki
description: "Offline-first, cross-platform spaced-repetition and knowledge-mining application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.1.1
  flutter_riverpod: ^3.4.3
  logging: ^1.3.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router_builder: ^4.5.2
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP/NotoSansJP-Variable.ttf
