name: memuki
description: "Offline-first, cross-platform spaced-repetition and knowledge-mining application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.1.1
  flutter_riverpod: ^3.4.3
  logging: ^1.3.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  uuid: ^4.6.0
  crypto: ^3.0.8
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path: ^1.9.1
  path_provider: ^2.1.6
  mime: ^2.1.0
  meta: ^1.19.0
  lucide_icons_flutter: ^4.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router_builder: ^4.5.2
  build_runner: ^2.16.2
  freezed: ^4.0.3
  drift_dev: ^2.35.2
  sqlite3: ^3.8.0
  args: ^2.7.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP/NotoSansJP-Variable.ttf
    - family: ZenMaruGothic
      fonts:
        - asset: assets/fonts/ZenMaruGothic/ZenMaruGothic-Bold.ttf
          weight: 700
